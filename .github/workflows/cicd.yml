name: ShroomSync Frontend CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: shroomsync-frontend-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/fsociety781/shroomsync-frontend

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test --if-present

      - name: Build frontend
        run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main

  deploy-production:
    needs: test-build-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Frontend to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST || '103.119.237.30' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD || 'MySCx9yDU7xkaNuG' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '20159' }}
          command_timeout: 10m
          script: |
            set -eu

            cd /opt/shroomsync/frontend

            echo "📥 Mengambil commit terbaru dari GitHub..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔨 Membangun kontainer Frontend..."
            docker compose build frontend

            echo "🚀 Memperbarui kontainer shroomsync_frontend..."
            docker compose up -d --no-deps frontend

            echo "⏳ Menunggu health check Frontend (max 60 detik)..."
            HEALTHY=0
            for i in $(seq 1 30); do
              if curl --fail --silent --max-time 3 http://127.0.0.1:8080 > /dev/null 2>&1; then
                HEALTHY=1
                echo "✅ Frontend berhasil berjalan pada percobaan ke-$i!"
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" -eq 0 ]; then
              echo "❌ Frontend gagal merespons health check dalam 60 detik."
              docker compose logs --tail 50 frontend
              exit 1
            fi

            echo "🎉 Frontend berhasil dideploy ke VPS dan dapat diakses publik!"
